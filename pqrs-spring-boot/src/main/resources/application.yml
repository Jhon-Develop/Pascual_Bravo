spring:
  application:
    name: pqrs-microservice

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  config:
    import: optional:file:.env[.properties]

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  # --- CONFIGURACIÓN GLOBAL DE FLYWAY ---
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    # Forzar la ruta dinámicamente según el perfil activo desde el nivel raíz:
    locations: classpath:db/migration/${spring.profiles.active}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      probes:
        enabled: true

app:
  seed:
    enabled: ${SEED_DATA_ENABLED:false}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:${GMAIL_USERNAME:}}
    from-name: ${MAIL_FROM_NAME:PQRS Microservice}

pqrs:
  monitor:
    cron: "${PQRS_MONITOR_CRON:0 0 * * * *}"

---
# Bloque para el perfil MySQL (Clever Cloud / Prod)
spring:
  config:
    activate:
      on-profile: mysql

  datasource:
    url: jdbc:mysql://${MYSQL_ADDON_HOST:${DB_HOST:localhost}}:${MYSQL_ADDON_PORT:${DB_PORT:3306}}/${MYSQL_ADDON_DB:${DB_NAME:pqrs}}?useSSL=${DB_USE_SSL:true}&requireSSL=${DB_REQUIRE_SSL:true}&serverTimezone=UTC&characterEncoding=utf8&useUnicode=true&allowPublicKeyRetrieval=true
    username: ${MYSQL_ADDON_USER:${DB_USERNAME:}}
    password: ${MYSQL_ADDON_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver

---
# Bloque para el perfil Dev (H2)
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:file:./data/pqrsdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: